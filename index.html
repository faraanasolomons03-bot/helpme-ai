<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpMe AI 💗</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff4fa, #f4efff);
      color: #29232d;
      display: flex;
      justify-content: center;
      padding: 25px;
    }
    .app { width: min(900px, 100%); }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 50px; height: 50px; border-radius: 16px;
      background: white; display: grid; place-items: center;
      font-size: 25px; box-shadow: 0 8px 25px #00000012;
    }
    h1 { margin: 0; font-size: 26px; }
    .tag { margin: 4px 0 0; color: #817985; font-size: 13px; }
    .plus {
      border: 0; background: #29232d; color: white;
      padding: 11px 17px; border-radius: 999px;
      font-weight: bold; cursor: pointer;
    }
    .chat {
      background: #ffffffdf; border-radius: 26px;
      box-shadow: 0 20px 60px #8b6f8b22;
      overflow: hidden; border: 1px solid white;
    }
    #messages {
      min-height: 65vh; padding: 25px; overflow-y: auto;
    }
    .welcome { text-align: center; padding: 80px 20px; color: #77707b; }
    .welcome h2 { color: #29232d; font-size: 30px; margin-bottom: 8px; }
    .chips { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
    .chip {
      background: white; border: 1px solid #eadfea;
      border-radius: 999px; padding: 10px 14px; cursor: pointer;
    }
    .message { display: flex; margin: 12px 0; }
    .message.user { justify-content: flex-end; }
    .bubble {
      max-width: 78%; padding: 13px 16px;
      border-radius: 18px; line-height: 1.5; white-space: pre-wrap;
    }
    .assistant .bubble { background: #f4edf5; }
    .user .bubble { background: #29232d; color: white; }
    form {
      display: flex; gap: 10px; padding: 14px;
      border-top: 1px solid #eee5ed; background: white;
    }
    textarea {
      flex: 1; border: 1px solid #dfd5e0; border-radius: 16px;
      padding: 13px; font: inherit; resize: none; outline: none;
    }
    .send {
      border: 0; border-radius: 16px; padding: 0 20px;
      background: #e9a7c8; font-weight: bold; cursor: pointer;
    }
    @media (max-width: 600px) {
      .tag { display: none; }
      .bubble { max-width: 90%; }
      header { gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">💗</div>
        <div>
          <h1>HelpMe AI</h1>
          <p class="tag">Your friendly AI assistant</p>
        </div>
      </div>
      <button class="plus" onclick="alert('HelpMe Plus will be connected to Stripe later!')">✨ HelpMe Plus</button>
    </header>

    <div class="chat">
      <div id="messages">
        <div class="welcome" id="welcome">
          <h2>Hi! I'm HelpMe AI 💕</h2>
          <p>Ask me anything or choose an idea below.</p>
          <div class="chips">
            <button class="chip" onclick="usePrompt('Give me a fun idea')">✨ Fun idea</button>
            <button class="chip" onclick="usePrompt('Help me study')">📚 Study help</button>
            <button class="chip" onclick="usePrompt('Help me write something')">✍️ Writing</button>
            <button class="chip" onclick="usePrompt('Help me plan my day')">🗓️ Plan my day</button>
          </div>
        </div>
      </div>

      <form onsubmit="sendMessage(event)">
        <textarea id="input" rows="1" placeholder="Type your message..." required></textarea>
        <button class="send" type="submit">Send</button>
      </form>
    </div>
  </div>

<script>
function usePrompt(text) {
  document.getElementById('input').value = text;
  document.getElementById('input').focus();
}
function addMessage(type, text) {
  document.getElementById('welcome')?.remove();
  const row = document.createElement('div');
  row.className = 'message ' + type;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  document.getElementById('messages').appendChild(row);
  document.getElementById('messages').scrollTop = 999999;
}
function sendMessage(event) {
  event.preventDefault();
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  addMessage('user', text);
  input.value = '';

  // Temporary response until the secure AI API is connected.
  setTimeout(() => {
    addMessage('assistant',
      'Hi! 💗 Your HelpMe AI app is working! The next step is connecting the secure AI API so I can give real AI answers.'
    );
  }, 500);
}
</script>
</body>
</html>
